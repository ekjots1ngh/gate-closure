name: demo

# Publishes the built demo (web/dist) to GitHub Pages whenever it changes, at
# https://ekjots1ngh.github.io/gate-closure/ (Settings, Pages, source: GitHub Actions).
on:
  push:
    branches: [main]
    paths: ["web/dist/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
