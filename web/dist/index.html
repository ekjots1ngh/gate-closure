osition:absolute;bottom:-4px;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:var(--ink)}.masthead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px;border-bottom:1px solid var(--rule)}.masthead h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.01em}.masthead h1 span{color:var(--ink-faint);font-weight:400;margin-left:12px}.clock{display:flex;align-items:baseline;gap:12px}.clock .time{font-size:30px;font-weight:700;line-height:1}.clock .day{color:var(--ink-soft)}.controls{display:flex;gap:6px;justify-content:end;align-items:center}.controls button{background:var(--recess);border:1px solid var(--rule);border-radius:3px;padding:5px 10px;cursor:pointer;color:var(--ink-soft)}.controls button[aria-pressed=true]{border-color:var(--ink-soft);color:var(--ink);background:#39443e}.controls .poison{margin-left:10px}.controls .poison[aria-pressed=true]{border-color:var(--short);color:var(--short)}.deck{display:grid;grid-template-columns:minmax(300px,31%) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;min-height:0}.region{position:relative;min-width:0;min-height:0;padding:14px 22px 12px;display:flex;flex-direction:column}.region h2{margin:0 0 6px;font-size:13px;font-weight:400;color:var(--ink-faint);letter-spacing:.02em}.region .note{color:var(--ink-faint);font-size:12px;margin:6px 0 0;max-width:72ch}.map{grid-column:1;grid-row:1 / span 2;border-right:1px solid var(--rule)}.gate{grid-column:2;grid-row:1}.battery{grid-column:2;grid-row:2;border-top:1px solid var(--rule);display:grid;grid-template-columns:330px minmax(0,1fr);gap:0 28px;padding-bottom:14px}.battery h2{grid-column:1 / -1}.fill{flex:1;min-height:0}.readouts{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:baseline;margin-top:10px;font-size:13px;white-space:nowrap}.readouts .label{color:var(--ink-soft)}.readouts .value{text-align:right;font-size:15px}.readouts .delta{color:var(--ink-faint);font-size:12px;min-width:96px}.readouts .verdict{grid-column:1 / -1;margin-top:10px;padding-top:10px;border-top:1px solid var(--rule-soft);display:flex;justify-content:space-between;align-items:baseline}.readouts .verdict .big{font-size:22px;font-weight:700}.lamp{transition:fill .22s ease,opacity .22s ease}.tint{transition:fill-opacity .6s ease,fill .6s ease}@keyframes ring{0%{r:4px;opacity:.9}to{r:22px;opacity:0}}.pulse{animation:ring 1.4s ease-out 1;fill:none;stroke-width:1.5}@keyframes flash{0%{r:9px;opacity:.9}to{r:26px;opacity:0}}.print-flash{animation:flash .9s ease-out 1;fill:none;stroke-width:1.5}@keyframes flow{to{stroke-dashoffset:-24}}.feeder{stroke-dasharray:8 16}.feeder.charging{animation:flow .7s linear infinite}.feeder.discharging{animation:flow .7s linear infinite reverse}.cell{transition:fill .3s ease}.state{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 6px}.state .action{font-size:20px;font-weight:700}.legs{display:grid;grid-template-columns:1fr auto;gap:3px 16px;font-size:13px}.legs .figure{text-align:right}.legs .ours{color:var(--ink);font-weight:700}.record{max-width:1480px;margin:0 auto;padding:8px 22px 48px}.caption{color:var(--ink-soft);font-size:14px;margin:18px 0 0;max-width:100ch}.section{margin-top:44px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 40px}.section>h2{grid-column:1 / -1;margin:0 0 4px;font-size:24px;font-weight:700;padding-top:18px;border-top:1px solid var(--rule)}.section .lede{grid-column:1 / -1;color:var(--ink-soft);margin:0 0 18px;max-width:86ch;font-size:15px}.inset{min-width:0;padding-top:6px}.inset h2{margin:0 0 6px;font-size:16px;font-weight:700}.inset .note{color:var(--ink-faint);font-size:12.5px;margin:8px 0 0;max-width:70ch}.inset p{margin:4px 0 8px;color:var(--ink-soft)}svg text{font-family:var(--text);fill:var(--ink-soft);font-size:11px}svg .readout{fill:var(--ink)}svg .figure{fill:var(--ink)}.slider{width:100%;accent-color:var(--ink)}.figures{display:flex;gap:28px;margin-top:8px}.figures div{display:grid}.figures .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}.figures .label{color:var(--ink-soft);font-size:12px}.ledger-table{width:100%;border-collapse:collapse;font-size:12.5px}.ledger-table th{text-align:left;color:var(--ink-faint);font-weight:400;padding:3px 6px;border-bottom:1px solid var(--rule)}.ledger-table td{padding:3px 6px;border-bottom:1px solid #323c37;font-variant-numeric:tabular-nums}.ledger-table .pre-fix td{color:var(--ink-faint);text-decoration:line-through}.poison-card{border-left:3px solid var(--short);padding-left:18px}.check{font-size:30px;font-weight:700;color:var(--ink)}.controls.inline{justify-content:start;margin-top:10px}@media (max-width: 980px){.show{height:auto}.deck{grid-template-columns:1fr;grid-template-rows:auto}.map,.gate,.battery{grid-column:1;grid-row:auto;border-right:none;border-top:1px solid var(--rule)}.battery{grid-template-columns:1fr}.masthead{grid-template-columns:1fr;height:auto;padding:10px 16px;gap:6px}.section{grid-template-columns:1fr}}@media (prefers-reduced-motion: reduce){.pulse,.print-flash{animation:none;opacity:0}.feeder.charging,.feeder.discharging{animation:none}.lamp,.cell,.tint{transition:none}}</style>
